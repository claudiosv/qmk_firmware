# QK_BOOT, KC_NO,   KC_NO,   KC_NO,   KC_NO,   KC_NO,   KC_NO,   KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO,
#         KC_NO,   RM_PREV, RM_TOGG, RM_NEXT, RM_HUED, RM_HUEU, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, DB_TOGG, QK_MAKE,
#         _______, RM_VALD, RM_VALU, RM_SATD, RM_SATU, KC_NO, KC_NO, KC_NO, KC_NO, QK_LEAD, KC_NO, KC_NO, EE_CLR,  QK_REBOOT,
#                  KC_NO,   RM_SPDD, RM_SPDU, KC_NO,   KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO,
draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: false
  n_columns: 1
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: false
  key_side_pars:
    rel_x: 0
    rel_y: 4
    rel_w: 12
    rel_h: 12
    rx: 4
    ry: 4
  svg_extra_style: ''
  footer_text: ''
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyphs: {}
parse_config:
  preprocess: true
  skip_binding_parsing: false
  raw_binding_map: {}
  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    t: ▽
    type: trans
  layer_legend_map: {}
  mark_alternate_layer_activators: false
  modifier_fn_map:
    left_ctrl: Ctl
    right_ctrl: Ctl
    left_shift: Sft
    right_shift: Sft
    left_alt: Alt
    right_alt: AltGr
    left_gui: Gui
    right_gui: Gui
    keycode_combiner: '{mods}+{key}'
    mod_combiner: '{mod_1}+{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
  qmk_remove_keycode_prefix:
  - KC_
  qmk_keycode_map:
    XXXXXXX: ''
    'NO': ''
    MINUS: '-'
    MINS: '-'
    EQUAL: '='
    EQL: '='
    LEFT_BRACKET: '['
    LBRC: '['
    RIGHT_BRACKET: ']'
    RBRC: ']'
    BACKSLASH: \
    BSLS: \
    NONUS_HASH: '#'
    NUHS: '#'
    SEMICOLON: ;
    SCLN: ;
    QUOTE: ''''
    QUOT: ''''
    GRAVE: '`'
    GRV: '`'
    COMMA: ','
    COMM: ','
    DOT: .
    SLASH: /
    SLSH: /
    TILDE: '~'
    TILD: '~'
    EXCLAIM: '!'
    EXLM: '!'
    AT: '@'
    HASH: '#'
    DOLLAR: $
    DLR: $
    PERCENT: '%'
    PERC: '%'
    CIRCUMFLEX: ^
    CIRC: ^
    AMPERSAND: '&'
    AMPR: '&'
    ASTERISK: '*'
    ASTR: '*'
    LEFT_PAREN: (
    LPRN: (
    RIGHT_PAREN: )
    RPRN: )
    UNDERSCORE: _
    UNDS: _
    PLUS: +
    LEFT_CURLY_BRACE: '{'
    LCBR: '{'
    RIGHT_CURLY_BRACE: '}'
    RCBR: '}'
    PIPE: '|'
    COLON: ':'
    COLN: ':'
    DOUBLE_QUOTE: '"'
    DQUO: '"'
    DQT: '"'
    LEFT_ANGLE_BRACKET: <
    LABK: <
    LT: <
    RIGHT_ANGLE_BRACKET: '>'
    RABK: '>'
    GT: '>'
    QUESTION: '?'
    QUES: '?'
    RM_SATD: Sat -
    RM_SATU: Sat +
    RM_HUED: Hue -
    RM_HUEU: Hue +
    RM_SPDD: Spd -
    RM_SPDU: Spd +
    RM_PREV: Prev
    RM_TOGG: Toggle
    RM_NEXT: Next
    RM_VALD: Bri -
    RM_VALU: Bri +
    EE_CLR: Clear EEPROM
    QK_REBOOT: Reboot
    QK_MAKE: Make
    DB_TOGG: Debug Toggle
    QK_BOOT: Bootloader
    # Standard Modifiers & Editing
    KC_ESC: Esc
    KC_TAB: Tab
    KC_BSPC: Backspace
    KC_ENT: Enter
    KC_SPC: Space
    KC_DEL: Delete
    KC_LSFT: Shift
    KC_RSFT: Shift
    KC_LCTL: Ctrl
    KC_LALT: Alt
    KC_RALT: Alt
    KC_LWIN: Win
    KC_LOPT: Opt
    KC_LCMD: Cmd
    KC_RCMD: Cmd
    KC_CAPS: Caps Lock

    # Navigation
    KC_UP: ↑
    KC_DOWN: ↓
    KC_LEFT: ←
    KC_RGHT: →
    KC_HOME: Home
    KC_END: End

    # Layers & Leaders
    MO(_FN1): FN1
    MO(_FN2): FN2
    MO(_FN3): FN3
    QK_LEAD: Leader

    # Function Keys
    KC_F1: F1
    KC_F2: F2
    KC_F3: F3
    KC_F4: F4
    KC_F5: F5
    KC_F6: F6
    KC_F7: F7
    KC_F8: F8
    KC_F9: F9
    KC_F10: F10
    KC_F11: F11
    KC_F12: F12

    # Media & Power
    KC_MUTE: Mute
    KC_VOLD: Vol -
    KC_VOLU: Vol +
    KC_MPLY: Play
    KC_MPRV: Prev
    KC_MNXT: Next
    KC_SLEP: Sleep
    KC_WAKE: Wake
    KC_BRID: Bri -
    KC_BRIU: Bri +

    # Mouse Emulation
    MS_UP: Ms ↑
    MS_DOWN: Ms ↓
    MS_LEFT: Ms ←
    MS_RGHT: Ms →
    MS_WHLU: Whl ↑
    MS_WHLD: Whl ↓
    MS_BTN1: L-Click
    MS_BTN2: R-Click

    # Utilities & OS Shortcuts
    KC_CALC: Calc
    KC_WSCH: Search
    KC_MYCM: PC
    KC_TASK: Task View
    KC_FLXP: Explorer
    MAC_CTL_PIPE: Mac Ctrl |

